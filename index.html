*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#071a3a,#0c2a5a);display:flex;align-items:center;justify-content:center;padding:24px;color:#182033}
.card{width:min(920px,100%);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28)}

.photo-wrap{background:#f3f5f8;border-radius:18px;padding:14px;text-align:center}img{max-width:100%;max-height:620px;border-radius:12px;display:block;margin:auto}
.actions{text-align:center;margin-top:16px}.secondary{display:inline-block;padding:12px 18px;background:#071a3a;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}
#error{display:none;margin-top:18px;color:#a52a2a;font-weight:700}.foot{margin-top:22px;color:#7a8290;font-size:12px;text-align:center}
